name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]          # v0.20.0 -> ghcr.io/ottermq/ottermq:0.20.0 and :0.20
  pull_request:
    branches: [ "main" ]    # build only, never pushed

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0      # `make build` stamps the version from `git describe --tags`

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pull requests only build the image, so they don't need registry access
    # (PRs from forks don't get a token with packages: write anyway).
    - name: Log in to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/ottermq/ottermq
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=short

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: packaging/docker/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
